<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f1020;
  color:white;
}

.container{
  display:flex;
  flex-direction:row-reverse;
  min-height:100vh;
}

.demo{
  width:100%;
  background:#111;
  position:relative;
}

iframe{
  width:100%;
  height:100vh;
  border:none;
}

.right{
  width:30%;
  padding:30px 22px;
  background:linear-gradient(180deg,#181a35,#0b0c18);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-y:auto;
}

.box{
  width:100%;
  background:rgba(10,10,10,.88);
  border:1px solid #ff1744;
  border-radius:22px;
  padding:26px 20px;
  text-align:center;
  box-shadow:0 0 35px rgba(255,23,68,.28);
}

.badge{
  display:inline-block;
  background:#ff1744;
  color:#fff;
  padding:8px 18px;
  border-radius:30px;
  font-weight:800;
  margin-bottom:16px;
}

h1{
  font-size:34px;
  color:#ff1744;
  margin-bottom:10px;
  text-transform:uppercase;
}

.sub{
  font-size:17px;
  line-height:1.5;
  margin-bottom:22px;
  color:#eee;
}

.features{
  display:grid;
  gap:12px;
  margin:22px 0;
}

.feature{
  background:linear-gradient(90deg,#1b1b1b,#2b2208);
  border:1px solid rgba(212,175,55,.55);
  padding:14px;
  border-radius:14px;
  font-size:17px;
  font-weight:700;
}

.feature span{
  color:#ff1744;
}

.website-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:16px;
  font-size:14px;
  font-weight:bold;
}

.website-row a{
  text-decoration:none;
}

.website{
  color:#25D366;
}

.whatsapp-small{
  color:#ff1744;
}

.cta{
  display:block;
  background:#25D366;
  color:#fff;
  text-decoration:none;
  padding:17px;
  border-radius:16px;
  font-size:20px;
  font-weight:900;
  margin-top:22px;
  box-shadow:0 8px 18px rgba(37,211,102,.35);
  transition:.3s;
}

.cta:hover{
  transform:scale(1.03);
  background:#1ebe5d;
}

.trust{
  margin-top:16px;
  color:#ccc;
  font-size:14px;
  line-height:1.5;
}

.footer{
  margin-top:18px;
  font-size:12px;
  color:#aaa;
  line-height:1.5;
}

@media(max-width:768px){
  .container{
    flex-direction:column-reverse;
  }

  .demo,
  .right{
    width:100%;
  }

  iframe{
    height:500px;
  }

  .right{
    padding:20px;
  }
}

@media(max-width:480px){
  h1{
    font-size:28px;
  }

  .sub{
    font-size:16px;
  }

  .feature{
    font-size:16px;
    padding:12px;
  }

  .cta{
    font-size:18px;
    padding:15px;
  }

  .website-row{
    flex-direction:column;
    gap:8px;
  }
}
</style>

</head>

<body>

<div class="container">

  <div class="demo">
    <iframe src="https://dub.sh/gamebit"></iframe>
  </div>

</div>

</body>
</html>
